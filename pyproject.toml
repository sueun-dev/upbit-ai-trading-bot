[tool.poetry]
name = "upbit-ai-trading-bot"
version = "0.2.0"
description = "An AI-assisted automated trading system for the Upbit exchange"
authors = ["sueun-dev <sueun.dev@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "src" }]

# NOTE: runtime AI calls now go through the local OAuth bridge via requests.
# The openai dependency remains in the locked dependency set until Poetry is
# available to refresh poetry.lock safely.
[tool.poetry.dependencies]
python = "^3.11"
pyupbit = "^0.2.33"
openai = "^2.0"
requests = "^2.31"
python-dotenv = "^1.0"
lxml = ">=5.0"
pandas = ">=2.2"
feedparser = "^6.0.11"
chardet = ">=5.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
black = ">=24.0"
isort = ">=5.13"
flake8 = ">=7.0"
mypy = ">=1.8"
pandas-stubs = "*"
types-requests = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
upbit-trader = "main:main"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["src"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "pyupbit.*",
    "feedparser.*",
]
ignore_missing_imports = true
